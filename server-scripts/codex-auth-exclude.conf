# /etc/codex-auth-exclude.conf
#
# Учётки, которым НЕ раздаётся общий auth.json, т.е. доступ к Codex заблокирован.
# Формат: одна учётка в строке. Пустые строки и строки с # игнорируются.
# Файл перечитывается на каждом прогоне codex-auth-sync.sh, codex-reauth.sh
# и codex-block-watch.sh — перезапускать ничего не нужно.
#
# Полная блокировка сотрудника состоит из четырёх слоёв (одного файла мало):
#   1. изъять его ~/.codex/auth.json (сохранить, а не удалить);
#   2. положить на это место заглушку: root-owned, chmod 000, chattr +i.
#      Без chattr +i бесполезно: каталог ~/.codex принадлежит сотруднику,
#      поэтому root-овский файл он удалит обычным `rm` — право на удаление
#      даёт запись в КАТАЛОГЕ, а не в файле;
#   3. вписать учётку сюда (иначе cron вернёт токен в течение 6 часов,
#      а любой codex-reauth.sh — мгновенно);
#   4. включить codex-block-watch.sh — он ловит обходы через CODEX_HOME,
#      попытку `codex login` под личным аккаунтом и появление auth.json
#      в других каталогах.
#
# Подробности и рецепт снятия — в DOCUMENTATION.md, раздел «Блокировка доступа».
#
# Пример (закомментирован — по умолчанию блокировок нет):
# ivan
