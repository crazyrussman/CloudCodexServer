# /etc/codex-hungjob-blocklist.conf
#
# Команды, которым на этом сервере быть не должно. По одному regex в строке —
# выражение передаётся в `pgrep -f`, т.е. матчится по полной командной строке.
# Пустые строки и строки с # игнорируются. Файл перечитывается на каждом
# прогоне жнеца, перезапускать ничего не нужно.
#
# Когда это нужно. Агент в уже открытой сессии не видит правил, добавленных
# в его инструкции позже, и продолжает перезапускать запрещённый джоб. Против
# автоматики с авто-ретраем работает только автоматика того же темпа — ручной
# kill и правило в открытой сессии не помогают. Blocklist закрывает окно между
# «правило написано» и «сессия перезапущена».
#
# Как пользоваться:
#   • вписывайте сюда конкретные команды, которые уже доказали, что зависают
#     или не должны исполняться на сервере (тяжёлые браузерные прогоны,
#     сборки, которым место на локальной станции);
#   • экранируйте точки в именах файлов: fit-live-text\.mjs, а не fit-live-text.mjs;
#   • снять запрет = закомментировать строку;
#   • это временная мера. Постоянное решение — договорённость и правило
#     в инструкциях агента; blocklist нужен, пока оно не подействовало.
#
# Гигиеническая ветка жнеца (браузеры старше BROWSER_MAX_MIN) работает всегда
# и от этого файла не зависит — её отключать не нужно.
#
# По умолчанию запретов нет. Примеры формата (закомментированы):
# my-heavy-render\.mjs
# playwright-cli --session some-long-running-session
