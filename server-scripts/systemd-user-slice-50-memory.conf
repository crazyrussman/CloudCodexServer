# Лимиты памяти на пользователя.
# Файл: /etc/systemd/system/user-.slice.d/50-memory.conf
#
# Зачем. Без лимитов один тяжёлый процесс (headless-браузер, обработка
# изображений, сборка) выедает всю RAM машины, и глобальный OOM-killer убивает
# процессы ПОСТОРОННИХ пользователей — их контейнеры, базы, сессии. Радиус
# ущерба надо ограничить рамками того, кто его создал.
#
#   MemoryHigh — мягкий тормоз: реклейм и вытеснение в swap, без убийства.
#   MemoryMax  — жёсткий потолок: при пробое OOM-killer работает ВНУТРИ cgroup
#                виновника, соседи не страдают.
#
# MemorySwapMax обязателен вместе с ними. Одного лимита RAM недостаточно:
# MemoryHigh не убивает процесс, а выдавливает его страницы в общий swap — и
# один пользователь способен занять весь swap машины, после чего она уходит в
# thrash (высокий load, всё в D-state) при нулевом счётчике OOM.
#
# Значения подбирайте по факту: снимите `memory.peak` у слайсов за неделю
# нормальной работы и берите потолок с запасом над легитимным пиком, иначе
# лимит будет душить обычную работу. Приведённые числа рассчитаны на машину
# с 8 ГБ RAM и 8 ГБ swap.
#
# root исключается отдельным файлом user-0.slice.d/50-memory.conf.
# Применить: systemctl daemon-reload (подхватится и живыми слайсами).
# Откат: rm -rf /etc/systemd/system/user-.slice.d && systemctl daemon-reload
[Slice]
MemoryAccounting=yes
MemoryHigh=3.5G
MemoryMax=5G
MemorySwapMax=3G
