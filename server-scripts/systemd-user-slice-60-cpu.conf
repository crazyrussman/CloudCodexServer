# Потолок CPU на пользователя.
# Файл: /etc/systemd/system/user-.slice.d/60-cpu.conf
#
# Зачем. Лимиты памяти не защищают от исчерпания процессорного времени:
# десяток параллельных компиляторов или тестов одного пользователя способен
# положить интерактивность всем остальным — включая ssh и VSCode-сервер.
# Потолок делает тяжёлую задачу медленнее, но оставляет машину отзывчивой.
#
# 250% = 2.5 ядра. Ставьте примерно 60-70% от общего числа ядер, чтобы одному
# пользователю всегда оставалось место, но соседям хватало на интерактив.
#
# ГРАБЛЯ: значение с двойным процентом (CPUQuota=250%%) systemd молча
# игнорирует — лимит просто не применяется. Проверять надо не факт записи
# файла, а результат:
#   systemctl show user-<uid>.slice -p CPUQuotaPerSecUSec
#
# root исключается отдельным файлом user-0.slice.d/60-cpu.conf (infinity).
# Откат: rm -f /etc/systemd/system/user-*.slice.d/60-cpu.conf && systemctl daemon-reload
[Slice]
CPUAccounting=yes
CPUQuota=250%
