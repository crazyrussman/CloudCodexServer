# Срок протухания /tmp.
# Файл: /etc/tmpfiles.d/tmp.conf — имя совпадает с системным
# /usr/lib/tmpfiles.d/tmp.conf, поэтому файл ЗАМЕЩАЕТ его целиком.
#
# Зачем. По умолчанию в /tmp мусор живёт 30 дней. На общей машине с несколькими
# пользователями этого достаточно, чтобы забить раздел браузерными профилями,
# рендерами и выгрузками — а /tmp обычно лежит на том же разделе, что и корень.
#
# Семантика systemd: файл удаляется, только если atime, btime, ctime И mtime
# старше срока. Используемые venv и распакованные инструменты не трогаются —
# поэтому агрессивное сокращение срока освобождает меньше, чем кажется.
#
# NB: /tmp — общий каталог, видимый всем пользователям (режим 1777).
# Он не бэкапится и чистится по расписанию: рабочим данным там не место.
# Ограничить чтение чужих файлов можно через UMASK в /etc/login.defs.
D /tmp 1777 root root 10d

# Не трогать приватные /tmp сервисов. Дублирует штатное правило дистрибутива
# (Ubuntu 24.04 — /usr/lib/tmpfiles.d/systemd-tmp.conf), поэтому здесь это страховка:
# наш файл замещает tmp.conf, а не systemd-tmp.conf, но если в вашем дистрибутиве
# исключений нет — они появятся отсюда.
#
# 🔴 Главное про эти каталоги — не про уборщик systemd, а про РУЧНУЮ чистку /tmp.
# Юнит с PrivateTmp=yes получает при старте /tmp/systemd-private-<boot>-<юнит>-<rnd>.
# Каталог принадлежит root, лежит месяцами и выглядит как забытый мусор: типовые
# критерии ручной уборки («старше N дней», «никем не открыт») его НЕ защищают —
# открытых дескрипторов на сам каталог нет, хотя сервис жив. Удалили — сервис
# продолжает отвечать (namespace уже смонтирован), но любая команда, исполняемая
# внутри него, падает:
#   systemctl reload caddy -> Failed to set up mount namespacing: /tmp
#   caddy.service: Control process exited, code=exited, status=226/NAMESPACE
# Обнаруживается это не сразу, а когда конфиг понадобилось перечитать; лечится
# только перезапуском сервиса. Измерено: ручная чистка снесла шесть таких каталогов
# (caddy, polkit, logind, resolved, timesyncd, fwupd), и отказ вскрылся через 20 дней.
x /tmp/systemd-private-%b-*
X /tmp/systemd-private-%b-*/tmp

#q /var/tmp 1777 root root 30d
