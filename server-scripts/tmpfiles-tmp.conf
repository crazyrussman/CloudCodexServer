# Срок протухания /tmp.
# Файл: /etc/tmpfiles.d/tmp.conf — имя совпадает с системным
# /usr/lib/tmpfiles.d/tmp.conf, поэтому файл ЗАМЕЩАЕТ его целиком.
#
# Зачем. По умолчанию в /tmp мусор живёт 30 дней. На общей машине с несколькими
# пользователями этого достаточно, чтобы забить раздел браузерными профилями,
# рендерами и выгрузками — а /tmp обычно лежит на том же разделе, что и корень.
#
# Семантика systemd: файл удаляется, только если atime, btime, ctime И mtime
# старше срока. Используемые venv и распакованные инструменты не трогаются —
# поэтому агрессивное сокращение срока освобождает меньше, чем кажется.
#
# NB: /tmp — общий каталог, видимый всем пользователям (режим 1777).
# Он не бэкапится и чистится по расписанию: рабочим данным там не место.
# Ограничить чтение чужих файлов можно через UMASK в /etc/login.defs.
D /tmp 1777 root root 10d

# 🔴 ОБЯЗАТЕЛЬНО: не трогать приватные /tmp сервисов.
# Юнит с PrivateTmp=yes получает при старте каталог /tmp/systemd-private-<boot>-<юнит>-<rnd>.
# Пока сервис работает, каталог никто не открывает — его метки времени стареют, и уборщик
# сносит его вместе с обычным мусором. Сервис при этом продолжает работать (namespace уже
# смонтирован), но ЛЮБАЯ команда, выполняемая внутри его namespace, падает:
#   systemctl reload caddy -> Failed to set up mount namespacing: /tmp: No such file or directory
#   caddy.service: Control process exited, code=exited, status=226/NAMESPACE
# Лечится только перезапуском сервиса — то есть ломается ровно тогда, когда чинить некогда.
# Чем короче срок протухания, тем раньше выстрелит: при 10d — после 10 дней аптайма сервиса.
# Штатный файл Ubuntu этих строк не содержит; RHEL/Fedora — содержат.
x /tmp/systemd-private-%b-*
X /tmp/systemd-private-%b-*/tmp

#q /var/tmp 1777 root root 30d
